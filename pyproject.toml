[build-system]
requires = ["setuptools>=75.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bushelworks"
dynamic = ["version"]
description = "Scale house capture and settlement for country grain elevators"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "rkaushik-dev" }]
# Pinned exactly, not floored. The office box is rebuilt from this file once a
# year and a surprise minor version in the settlement path is not worth the
# convenience of a range.
dependencies = [
  "SQLAlchemy==2.0.38",
  "fastapi==0.115.8",
  "pydantic==2.10.6",
  "uvicorn[standard]==0.34.0",
  "alembic==1.14.1",
  "click==8.1.8",
]

[project.scripts]
bushelworks = "bushelworks.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "hypothesis==6.125.3",
  "httpx==0.28.1",
  "ruff==0.9.6",
  "mypy==1.15.0",
]

[tool.setuptools.dynamic]
version = { attr = "bushelworks.__version__" }

[tool.setuptools.package-data]
bushelworks = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
# Wide enough for a table definition with a named constraint on one line, which
# is most of the persistence layer.
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import order
  "B",    # bugbear
  "UP",   # pyupgrade
  "C4",   # comprehensions
  "SIM",  # simplify
  "RET",  # returns
  "PIE",  # small unnecessary constructs
  "RUF",  # ruff's own
  "N",    # pep8 naming
  "TRY",  # exception handling
]
ignore = [
  # A settlement line reads better as an explicit if than as a ternary, and
  # the ternary is what SIM108 wants.
  "SIM108",
  # The validation blocks check one contract kind and then several things
  # about it. Collapsing them into a single condition loses which rule the
  # error message belongs to.
  "SIM102",
  # A guard that returns False for each disqualifying condition reads in the
  # order the rule is written down. The single negated boolean does not.
  "SIM103",
  # Nearly every raise here carries a message naming the record that
  # refused. Moving those into the exception classes would give the
  # scale house a stack of subclasses and no more information.
  "TRY003",
  # A settlement that cannot be built raises on the spot rather than
  # collecting into a variable and raising at the end.
  "TRY301",
  # NotAuthorised and Forbidden are the two names the HTTP layer uses
  # for them and reading NotAuthorisedError in a router is worse.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
# Tests nest `with pytest.raises` inside a unit of work on purpose: the two
# blocks mean different things and collapsing them hides which one is under
# test. They also assert against broad exceptions where the point is that
# something refuses at all.
"tests/*" = ["B008", "B011", "B017", "B018", "C408", "SIM117"]
# Routers take dependencies as call defaults. That is the framework's calling
# convention and there is no way around it.
"src/bushelworks/api/*" = ["B008"]
# Migrations are generated from a template and keep its import block.
"migrations/*" = ["F401", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["bushelworks"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
