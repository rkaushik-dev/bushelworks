[build-system]
requires = ["setuptools>=69.0.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bushelworks"
version = "0.1.0"
description = "Scale house capture and settlement for country grain elevators"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "rkaushik-dev" }]
dependencies = [
  "SQLAlchemy==2.0.25",
  "fastapi==0.111.0",
  "pydantic==2.7.1",
  "uvicorn[standard]==0.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest==7.4.4",
  "httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
